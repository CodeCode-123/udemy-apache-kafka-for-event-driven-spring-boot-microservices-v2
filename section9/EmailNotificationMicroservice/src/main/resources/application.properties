server.port=0
spring.application.name=EmailNotificationMicroservice
spring.kafka.consumer.bootstrap-servers=localhost:9092,localhost:9094
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.group-id=product-created-events
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.type.mapping=com.appsdeveloperblog.ws.products.service.ProductCreatedEvent:com.appsdeveloperblog.ws.emailnotification.event.ProductCreatedEvent
