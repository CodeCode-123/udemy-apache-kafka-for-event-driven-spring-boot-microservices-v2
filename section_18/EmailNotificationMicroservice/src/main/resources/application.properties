server.port=0
spring.application.name=EmailNotificationMicroservice
spring.kafka.consumer.bootstrap-servers=localhost:9092,localhost:9094
#spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
#spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.group-id=product-created-events
spring.kafka.consumer.properties.spring.json.trusted.packages=com.appsdeveloperblog.ws.emailnotification.event
spring.kafka.consumer.properties.spring.json.type.mapping=\
  com.appsdeveloperblog.ws.products.service.ProductCreatedEvent:com.appsdeveloperblog.ws.emailnotification.event.ProductCreatedEvent

spring.kafka.listener.concurrency=3

app.request.url=http://localhost:8082/response/200

#H2 database and JPA configuration
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console