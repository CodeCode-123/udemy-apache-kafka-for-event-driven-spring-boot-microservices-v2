server.port=0
spring.kafka.consumer.bootstrap-servers=localhost:9092,localhost:9094

spring.kafka.consumer.group-id=amount-deposit-event
spring.kafka.consumer.properties.spring.json.trusted.packages=com.appsdeveloperblog.estore.DepositService.events
spring.kafka.consumer.properties.spring.json.type.mapping=\
